version: "3.9"

x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://patchpilot:patchpilot@postgres:5432/patchpilot}
  SYNC_DATABASE_URL: ${SYNC_DATABASE_URL:-postgresql+psycopg2://patchpilot:patchpilot@postgres:5432/patchpilot}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8001}
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ACCESS_TTL_MIN: ${JWT_ACCESS_TTL_MIN:-15}
  REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
  LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MODEL_STAGE: ${MODEL_STAGE:-Production}
  KB_VERSION: ${KB_VERSION:-v1}
  RETENTION_DAYS: ${RETENTION_DAYS:-30}
  DAILY_LLM_BUDGET_USD: ${DAILY_LLM_BUDGET_USD:-5.0}

services:
  # ─── Infrastructure ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchpilot
      POSTGRES_PASSWORD: patchpilot
      POSTGRES_DB: patchpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── ML Infrastructure ──────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlartifacts
    volumes:
      - mlflow_data:/mlflow.db
      - mlartifacts:/mlartifacts
    ports:
      - "5000:5000"

  # ─── Backend API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─── Arq Worker ──────────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./backend:/app
    command: python -m app.workers.main

  # ─── ML Service ──────────────────────────────────────────────────────────────
  ml-service:
    build:
      context: ./ml
      dockerfile: ../docker/Dockerfile.ml
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_STAGE: ${MODEL_STAGE:-Production}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models
      - ./ml:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    command: uvicorn serving.main:app --host 0.0.0.0 --port 8001 --reload

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8000

  # ─── Monitoring ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  mlflow_data:
  mlartifacts:
  prometheus_data:
  grafana_data:
